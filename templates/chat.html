<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoundedGlitchEngine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <main class="chat-container">
        <header>
            <div>
                <h1>BoundedGlitchEngine</h1>
                <p id="stats">loading...</p>
            </div>
            <div class="quick">
                <button type="button" data-cmd="train">train</button>
                <button type="button" data-cmd="stats">stats</button>
                <button type="button" data-cmd="help">help</button>
            </div>
        </header>

        <section id="chat" class="chat"></section>

        <details class="teach">
            <summary>teach the bot</summary>
            <form id="teach-form">
                <input id="t-q" type="text" placeholder="question" autocomplete="off" required>
                <input id="t-a" type="text" placeholder="answer" autocomplete="off" required>
                <button type="submit">Teach</button>
            </form>
        </details>

        <form id="chat-form">
            <input id="message" type="text" placeholder="Ask, or teach..."
                   autocomplete="off" required autofocus>
            <button type="submit">Send</button>
        </form>
    </main>

    <script>
        const chat = document.getElementById("chat");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const statsEl = document.getElementById("stats");

        function addMessage(role, text) {
            const msg = document.createElement("div");
            msg.className = `message ${role}`;
            const label = document.createElement("strong");
            label.textContent = role === "user" ? "You" : "BGE";
            const body = document.createElement("p");
            body.textContent = text;
            msg.append(label, body);
            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
            return msg;
        }

        async function refreshStats() {
            try {
                const s = await (await fetch("/stats")).json();
                statsEl.textContent =
                    `${s.taught_questions} taught · ${s.corpus_passages} passages · ` +
                    `${s.vocabulary} words`;
            } catch { statsEl.textContent = "offline"; }
        }

        async function send(text) {
            addMessage("user", text);
            const pending = addMessage("bot", "...");
            pending.classList.add("pending");
            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                pending.querySelector("p").textContent = data.reply || "Request failed.";
            } catch (err) {
                pending.querySelector("p").textContent = "Connection error.";
                console.error(err);
            }
            pending.classList.remove("pending");
            chat.scrollTop = chat.scrollHeight;
            refreshStats();
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            send(text);
        });

        document.querySelectorAll("[data-cmd]").forEach((b) =>
            b.addEventListener("click", () => send(b.dataset.cmd)));

        document.getElementById("teach-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const q = document.getElementById("t-q");
            const a = document.getElementById("t-a");
            const res = await fetch("/teach", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: q.value, answer: a.value })
            });
            const data = await res.json();
            addMessage("bot", data.reply);
            q.value = a.value = "";
            refreshStats();
        });

        addMessage("bot", "Ask me something, or teach me: teach: question = answer");
        refreshStats();
    </script>
</body>
</html>
